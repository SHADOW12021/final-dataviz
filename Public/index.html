<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project!</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .tab-button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .tab-button:hover {
      background-color: #0056b3;
    }

    .tab-button.active {
      background-color: #0056b3;
    }

    .graph-container {
      width: 90%;
      height: calc(100vh - 160px);
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .text-overlay {
      text-align: center;
      margin-bottom: 20px;
    }

    .text-overlay h2 {
      font-size: 2rem;
      margin: 0;
    }

    .text-overlay p {
      font-size: 1.2rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="text-overlay">
      <h2>Final Project</h2>
      <p>Explore the visualizations below!</p>
    </div>

    <div class="tab-container">
      <button class="tab-button active" data-src="/heatmap.html">Heatmap</button>
      <button class="tab-button" data-src="/polar_axis.html">Polar Chart</button>
      <button class="tab-button" data-src="/stacked_bar_chart.html">Stacked Bar Chart</button>
    </div>

    <div class="graph-container">
      <iframe id="graph-frame" src="/heatmap.html"></iframe>
    </div>
  </div>

  <script>
    const tabButtons = document.querySelectorAll(".tab-button");
    const graphFrame = document.getElementById("graph-frame");

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        tabButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        graphFrame.src = button.getAttribute("data-src");
      });
    });

    window.addEventListener("resize", () => {
      const graphContainer = document.querySelector(".graph-container");
      const containerHeight = window.innerHeight;
      const tabsHeight = document.querySelector(".tab-container").offsetHeight;
      const textOverlayHeight = document.querySelector(".text-overlay").offsetHeight;
      const margin = 40; 
      graphContainer.style.height = `${containerHeight - tabsHeight - textOverlayHeight - margin}px`;
    });

    //resize
    window.dispatchEvent(new Event("resize"));
  </script>
</body>
</html>
