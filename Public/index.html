<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project!</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .tab-button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .tab-button:hover {
      background-color: #0056b3;
    }

    .tab-button.active {
      background-color: #0056b3;
    }

    .graph-container {
      width: 90%;
      height: calc(100vh - 160px);
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .text-overlay {
      text-align: center;
      margin-bottom: 20px;
    }

    .text-overlay h2 {
      font-size: 2rem;
      margin: 0;
    }

    .text-overlay p {
      font-size: 1.2rem;
      color: #666;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 800px;
      text-align: center;
    }

    .modal-content iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 8px;
    }

    .close-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .close-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="container">
    <div class="text-overlay">
      <h2>Final Project</h2>
      <p>Our visualizations are below!</p>
    </div>

    <div class="tab-container">
      <button class="tab-button active" data-src="/heatmap.html">Heatmap</button>
      <button class="tab-button" data-src="/polar_axis.html">Polar Chart</button>
      <button class="tab-button" data-src="/stacked_bar_chart.html">Stacked Bar Chart</button>
      <button class="tab-button" data-src="/gapminder.html">Gapminder Chart</button>
      <button id="video-button" class="tab-button">Watch Video</button>
    </div>

    <div class="graph-container">
      <iframe id="graph-frame" src="/heatmap.html"></iframe>
    </div>
  </div>

  <div id="video-modal" class="modal">
    <div class="modal-content">
      <iframe src="https://www.youtube.com/embed/watch?v=_Fsi6kSxDp8" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <button class="close-button" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const tabButtons = document.querySelectorAll(".tab-button");
    const graphFrame = document.getElementById("graph-frame");

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (button.id !== "video-button") {
          tabButtons.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          graphFrame.src = button.getAttribute("data-src");
        }
      });
    });

    const videoModal = document.getElementById("video-modal");
    const videoButton = document.getElementById("video-button");

    videoButton.addEventListener("click", () => {
      videoModal.style.display = "flex";
    });

    function closeModal() {
      videoModal.style.display = "none";
    }

    window.addEventListener("click", (event) => {
      if (event.target === videoModal) {
        closeModal();
      }
    });

    window.addEventListener("resize", () => {
      const graphContainer = document.querySelector(".graph-container");
      const containerHeight = window.innerHeight;
      const tabsHeight = document.querySelector(".tab-container").offsetHeight;
      const textOverlayHeight = document.querySelector(".text-overlay").offsetHeight;
      const margin = 40;
      graphContainer.style.height = `${containerHeight - tabsHeight - textOverlayHeight - margin}px`;
    });

    window.dispatchEvent(new Event("resize"));
  </script>
</body>
</html>
